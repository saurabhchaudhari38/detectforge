id: DF-LNX-002
title: SSH password spraying across many accounts
status: stable
description: >
  One source IP fails SSH authentication against five or more distinct usernames within
  ten minutes. Spraying stays under per-account lockout limits, so a simple failure count
  per user misses it.
author: detectforge
severity: high
tags: [attack.credential_access, attack.t1110.003]
logsource: {product: linux, service: sshd}
type: threshold
detection:
  failed_login:
    event.action: ssh_login
    event.outcome: failure
  condition: failed_login
threshold:
  count: 5
  window: 10m
  group_by: [source.ip]
  distinct: user.name
falsepositives:
  - Vulnerability scanners with credential checks enabled
references:
  - https://attack.mitre.org/techniques/T1110/003/
tests:
  - name: five distinct users from one IP fire
    expect: 1
    events:
      - {"@timestamp": "2026-10-12T09:00:00Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: oracle}}
      - {"@timestamp": "2026-10-12T09:01:00Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: postgres}}
      - {"@timestamp": "2026-10-12T09:02:00Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: ubuntu}}
      - {"@timestamp": "2026-10-12T09:03:00Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: admin}}
      - {"@timestamp": "2026-10-12T09:04:00Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: git}}
  - name: many failures against one user are not spraying
    expect: 0
    events:
      - {"@timestamp": "2026-10-12T09:00:00Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: root}}
      - {"@timestamp": "2026-10-12T09:00:01Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: root}}
      - {"@timestamp": "2026-10-12T09:00:02Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: root}}
      - {"@timestamp": "2026-10-12T09:00:03Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: root}}
      - {"@timestamp": "2026-10-12T09:00:04Z", event: {action: ssh_login, outcome: failure}, source: {ip: 198.51.100.23}, user: {name: root}}
