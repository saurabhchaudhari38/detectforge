id: DF-WIN-005
title: Office application spawned a shell or script host
status: stable
description: >
  Word, Excel, PowerPoint or Outlook started a command interpreter or script host. This
  is the typical execution chain of a malicious macro document.
author: detectforge
severity: high
tags: [attack.initial_access, attack.execution, attack.t1566.001, attack.t1204.002]
logsource: {category: process_creation, product: windows}
detection:
  office_parent:
    process.parent.name: [winword.exe, excel.exe, powerpnt.exe, outlook.exe, msaccess.exe]
  shell_child:
    process.name: [cmd.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe]
  condition: office_parent and shell_child
falsepositives:
  - Legacy line-of-business macros; baseline them per document path
tests:
  - name: winword spawning powershell fires
    expect: 1
    events:
      - {"@timestamp": "2026-10-12T10:00:00Z", process: {name: powershell.exe, parent: {name: WINWORD.EXE}}}
  - name: explorer spawning powershell does not fire
    expect: 0
    events:
      - {"@timestamp": "2026-10-12T10:00:00Z", process: {name: powershell.exe, parent: {name: explorer.exe}}}
