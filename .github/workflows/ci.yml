name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest --cov=detectforge --cov-report=term-missing

  rules:
    # Detection-as-code gate: every rule must parse and pass its embedded tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Validate rules
        run: detectforge validate rules/
      - name: Run rule tests
        run: detectforge test rules/ --verbose
      - name: Scan sample data
        run: |
          detectforge scan --year 2026 samples/auth.log samples/endpoint_events.jsonl
          detectforge scan --year 2026 --output navigator -o layer.json samples/*
      - uses: actions/upload-artifact@v4
        with:
          name: attack-navigator-layer
          path: layer.json
